<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Love You Zouzou ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffd6e7, #ffeaf2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b1839;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 650px;
      text-align: center;
      padding: 55px 30px;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(180, 60, 100, 0.18);
      backdrop-filter: blur(12px);
      animation: appear 1.2s ease;
    }

    .kiss {
      font-size: 65px;
      margin-bottom: 15px;
      display: inline-block;
      animation: kissBounce 2s infinite ease-in-out;
    }

    h1 {
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 800;
      color: #c2185b;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 21px;
      color: #7a2949;
      margin-bottom: 25px;
    }

    .message {
      font-size: 17px;
      line-height: 1.7;
      color: #71314b;
      margin-bottom: 30px;
    }

    .timer {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 50px;
      background: #c2185b;
      color: white;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(194, 24, 91, 0.25);
    }

    .heart {
      position: absolute;
      color: #e91e63;
      font-size: 25px;
      opacity: 0.7;
      animation: float 8s linear infinite;
      bottom: -50px;
    }

    .heart:nth-child(1) {
      left: 8%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 20%;
      animation-delay: 2s;
      font-size: 18px;
    }

    .heart:nth-child(3) {
      left: 35%;
      animation-delay: 4s;
      font-size: 32px;
    }

    .heart:nth-child(4) {
      left: 55%;
      animation-delay: 1s;
      font-size: 20px;
    }

    .heart:nth-child(5) {
      left: 72%;
      animation-delay: 3s;
      font-size: 30px;
    }

    .heart:nth-child(6) {
      left: 88%;
      animation-delay: 5s;
      font-size: 22px;
    }

    .kiss-float {
      position: absolute;
      font-size: 35px;
      opacity: 0;
      animation: kissFloat 7s linear infinite;
    }

    .kiss-float:nth-of-type(1) {
      left: 15%;
      animation-delay: 1s;
    }

    .kiss-float:nth-of-type(2) {
      right: 15%;
      animation-delay: 4s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes kissBounce {
      0%, 100% {
        transform: scale(1) rotate(-5deg);
      }

      50% {
        transform: scale(1.12) rotate(5deg);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.7;
      }

      85% {
        opacity: 0.7;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes kissFloat {
      0% {
        transform: translateY(100vh) scale(0.7) rotate(-15deg);
        opacity: 0;
      }

      15% {
        opacity: 0.8;
      }

      80% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-20vh) scale(1.2) rotate(15deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 45px 22px;
      }

      .kiss {
        font-size: 55px;
      }

      .subtitle {
        font-size: 18px;
      }

      .message {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Floating Hearts -->
  <div class="heart">♥</div>
  <div class="heart">♥</div>
  <div class="heart">♥</div>
  <div class="heart">♥</div>
  <div class="heart">♥</div>
  <div class="heart">♥</div>

  <!-- Floating Kisses -->
  <div class="kiss-float">💋</div>
  <div class="kiss-float">💋</div>

  <!-- Main Message -->
  <div class="container">

    <div class="kiss">💋</div>

    <h1>Love You Zouzou!</h1>

    <div class="subtitle">
      Your website is being created with love ❤️
    </div>

    <div class="message">
      Something beautiful is on its way... ✨<br>
      Your website is currently under construction.
      <br><br>
      Just wait around <strong>30 minutes</strong>...
      and your little surprise will be ready! 💕
    </div>

    <div class="timer">
      💋 Coming Soon... 💋
    </div>

  </div>

</body>
</html>
